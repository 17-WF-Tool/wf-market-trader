name: DevSecOps CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.vscode/**'

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # 1. 敏感憑證與密鑰掃描 (Secret Leak Detection)
  # -------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks via Docker
        run: |
          docker run -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose --redact

  # -------------------------------------------------------------
  # 2. 第三方依賴漏洞檢測 (SCA / Dependency Audit)
  # -------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

  # -------------------------------------------------------------
  # 3. 程式碼風格與語法規範檢查 (Code Style & Linting)
  # -------------------------------------------------------------
  code-style:
    name: Code Quality & Style Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (ESLint / Style Check)
        run: npm run lint

  # -------------------------------------------------------------
  # 4. 程式碼靜態安全分析 (SAST via CodeQL)
  # -------------------------------------------------------------
  codeql-sast:
    name: Static Code Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------
  # 5. 構建驗證與型別安全 (Build & Type Check)
  # -------------------------------------------------------------
  build-and-verify:
    name: Build & Type Check
    runs-on: ubuntu-latest
    needs: [code-style, i18n-check, dependency-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: TypeScript Validation & Vite Build
        run: npm run build