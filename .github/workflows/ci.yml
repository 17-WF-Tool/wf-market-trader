name: DevSecOps CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.vscode/**'

  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'issue/**'
      - 'dev*'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.vscode/**'

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # 1. 敏感憑證與密鑰掃描 (Secret Leak Detection)
  # -------------------------------------------------------------
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # 2. 第三方依賴漏洞檢測 (SCA / Dependency Audit)
  # -------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

  # -------------------------------------------------------------
  # 3. 程式碼風格與語法規範檢查 (Code Style & Linting)
  # -------------------------------------------------------------
  code-style:
    name: Code Quality & Style Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (ESLint / Style Check)
        run: npm run lint

  # -------------------------------------------------------------
  # 4. 多語系完整性檢查 (i18n Integrity Test)
  # -------------------------------------------------------------
  i18n-check:
    name: i18n Integrity Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Multi-Language Completeness
        # 驗證 TC/EN/SC 欄位無缺漏
        run: npm run test:i18n

  # -------------------------------------------------------------
  # 5. 程式碼靜態安全分析 (SAST via CodeQL)
  # -------------------------------------------------------------
  codeql-sast:
    name: Static Code Analysis (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -------------------------------------------------------------
  # 6. 構建驗證與型別安全 (Build & Type Check)
  # -------------------------------------------------------------
  build-and-verify:
    name: Build & Type Check
    runs-on: ubuntu-latest
    needs: [code-style, i18n-check, dependency-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: TypeScript Validation & Vite Build
        run: npm run build